name: 점수 갱신 (매일)

# 한국 증시 마감(15:30 KST) 이후 — UTC 09:30 = KST 18:30
# 평일만 실행합니다.
on:
  schedule:
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 재무 데이터 확인
        run: |
          if [ ! -f data/financials.json ]; then
            echo "data/financials.json이 없습니다."
            echo "먼저 «재무 수집 (분기)» 워크플로를 수동 실행하세요."
            exit 1
          fi

      - name: 시세 조회 및 점수 계산
        run: node scripts/build-scores.mjs

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scores.json
          git diff --staged --quiet || git commit -m "점수 갱신 $(date +%Y-%m-%d)"
          git push
