name: 재무 수집 (분기)

# 사업보고서·분기보고서 제출 마감 직후로 잡았습니다.
# 4/1, 6/1, 9/1, 12/1 새벽 (KST 기준 오전 9시)
on:
  schedule:
    - cron: '0 0 1 4,6,9,12 *'
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: DART 재무 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/collect-financials.mjs

      - name: 점수 재계산
        run: node scripts/build-scores.mjs

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/financials.json data/scores.json
          git diff --staged --quiet || git commit -m "재무 데이터 갱신 $(date +%Y-%m-%d)"
          git push
